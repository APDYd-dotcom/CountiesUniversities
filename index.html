<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholar Registration</title>

    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --border-dark: #d1d5db;
            --primary: #111827;
            --primary-hover: #000000;
            --success-bg: #ecfdf5;
            --success-text: #047857;
            --error-bg: #fef2f2;
            --error-text: #b91c1c;
            --warning-bg: #fffbeb;
            --warning-text: #92400e;
            --warning-border: #fcd34d;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input, select {
            font: inherit;
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 38px 18px 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: var(--primary);
            color: white;
            font-size: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin: 0;
            font-size: 29px;
            line-height: 1.2;
            letter-spacing: -0.8px;
        }

        .header p {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 26px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.045);
        }

        .status {
            display: none;
            padding: 12px 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.45;
        }

        .status.success {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status.error {
            display: block;
            background: var(--error-bg);
            color: var(--error-text);
        }

        .status.warning {
            display: block;
            background: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
        }

        .field {
            margin-bottom: 20px;
        }

        .field:last-of-type {
            margin-bottom: 22px;
        }

        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 650;
            color: #374151;
        }

        .required {
            color: #9ca3af;
            font-size: 11px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            height: 49px;
            padding: 0 14px;
            border: 1px solid var(--border-dark);
            border-radius: 11px;
            background: white;
            color: var(--text);
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus, select:focus {
            border-color: #111827;
            box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.07);
        }

        select:disabled {
            color: #9ca3af;
            background: #f9fafb;
            cursor: not-allowed;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper select {
            appearance: none;
            padding-right: 42px;
        }

        .select-arrow {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #6b7280;
            font-size: 13px;
        }

        .helper {
            min-height: 18px;
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .helper.warning {
            color: var(--warning-text);
        }

        .helper.error {
            color: var(--error-text);
        }

        .primary-button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 11px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: background .18s ease, transform .1s ease;
        }

        .primary-button:hover {
            background: var(--primary-hover);
        }

        .primary-button:active {
            transform: translateY(1px);
        }

        .primary-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 25px 0 18px;
        }

        .data-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .data-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .data-title {
            font-size: 13px;
            font-weight: 650;
        }

        .data-count {
            color: var(--muted);
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .secondary-button {
            height: 39px;
            padding: 0 13px;
            border: 1px solid var(--border-dark);
            border-radius: 9px;
            background: white;
            color: #374151;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .secondary-button:hover {
            background: #f9fafb;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .spinner {
            width: 13px;
            height: 13px;
            border: 2px solid #e5e7eb;
            border-top-color: #111827;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .retry-button {
            background: none;
            border: none;
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
            margin-left: 6px;
        }

        .retry-button:hover {
            color: #1d4ed8;
        }

        @media (max-width: 600px) {
            .page {
                padding: 24px 13px 40px;
            }
            .card {
                padding: 20px;
                border-radius: 17px;
            }
            .header h1 {
                font-size: 25px;
            }
            .data-bar {
                align-items: flex-start;
                flex-direction: column;
            }
            .actions {
                width: 100%;
            }
            .secondary-button {
                flex: 1;
            }
        }
    </style>
</head>
<body>

<div class="page">
    <header class="header">
        <div class="logo" aria-hidden="true">🎓</div>
        <h1>Scholar Registration</h1>
        <p>Select your country and university to continue</p>
    </header>

    <main class="card">
        <div id="status" class="status" role="alert"></div>

        <form id="registrationForm" novalidate>
            <!-- COUNTRY -->
            <div class="field">
                <div class="label-row">
                    <label for="country">Country</label>
                    <span class="required">Required</span>
                </div>
                <div class="select-wrapper">
                    <select id="country" name="country" required disabled>
                        <option value="">Loading countries...</option>
                    </select>
                    <span class="select-arrow" aria-hidden="true">⌄</span>
                </div>
                <div id="countryHelper" class="helper"></div>
            </div>

            <!-- UNIVERSITY -->
            <div class="field">
                <div class="label-row">
                    <label for="university">University</label>
                    <span class="required">Required</span>
                </div>
                <div class="select-wrapper">
                    <select id="university" name="university" required disabled>
                        <option value="">Select a country first</option>
                    </select>
                    <span class="select-arrow" aria-hidden="true">⌄</span>
                </div>
                <div id="universityHelper" class="helper"></div>
            </div>

            <!-- NAME -->
            <div class="field">
                <div class="label-row">
                    <label for="name">Full name</label>
                    <span class="required">Required</span>
                </div>
                <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required maxlength="120">
            </div>

            <!-- PHONE -->
            <div class="field">
                <div class="label-row">
                    <label for="phone">Phone number</label>
                    <span class="required">Required</span>
                </div>
                <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+257 79 123 456" required maxlength="30">
            </div>

            <!-- SUBMIT -->
            <button id="submitButton" class="primary-button" type="submit">
                Save Registration
            </button>
        </form>

        <div class="divider"></div>

        <!-- DATA ACTIONS -->
        <div class="data-bar">
            <div class="data-info">
                <span class="data-title">Local registrations</span>
                <span id="registrationCount" class="data-count">0 records</span>
            </div>

            <div class="actions">
                <button type="button" id="exportButton" class="secondary-button">↓ Export JSON</button>
                <button type="button" id="clearButton" class="secondary-button">Clear</button>
            </div>
        </div>
    </main>
</div>

<script>
/*
==========================================================
CONFIGURATION
==========================================================
*/
// ⚠️ IMPORTANT: Replace this URL with your deployed Cloudflare Worker URL.
const WORKER_URL = "https://your-worker-name.your-subdomain.workers.dev";

const CONFIG = {
    apiBase: WORKER_URL,
    storageKey: "scholar_registrations_v1"
};

/*
==========================================================
DOM ELEMENTS
==========================================================
*/
const countrySelect = document.getElementById("country");
const universitySelect = document.getElementById("university");
const countryHelper = document.getElementById("countryHelper");
const universityHelper = document.getElementById("universityHelper");
const nameInput = document.getElementById("name");
const phoneInput = document.getElementById("phone");
const form = document.getElementById("registrationForm");
const statusBox = document.getElementById("status");
const submitButton = document.getElementById("submitButton");
const exportButton = document.getElementById("exportButton");
const clearButton = document.getElementById("clearButton");
const registrationCount = document.getElementById("registrationCount");

/*
==========================================================
APPLICATION STATE
==========================================================
*/
let countries = [];
let selectedCountry = null;
let universities = [];
let universityRequestController = null;

/*
==========================================================
UTILITY: STATUS
==========================================================
*/
function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = `status ${type}`;
}

function hideStatus() {
    statusBox.textContent = "";
    statusBox.className = "status";
}

/*
==========================================================
UTILITY: LOADING
==========================================================
*/
function setUniversityLoading(isLoading) {
    if (isLoading) {
        universityHelper.innerHTML = `
            <span class="loading">
                <span class="spinner"></span>
                Loading universities...
            </span>
        `;
    } else {
        universityHelper.textContent = "";
    }
}

/*
==========================================================
LOAD COUNTRIES - From Cloudflare Worker
==========================================================
*/
async function loadCountries() {
    countrySelect.disabled = true;
    countrySelect.innerHTML = `<option value="">Loading countries...</option>`;

    try {
        const response = await fetch(`${CONFIG.apiBase}/api/countries`, {
            method: "GET",
            headers: {
                "Accept": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error(`API returned ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        // Worker returns the raw CountriesNow response: { error, msg, data }
        if (data.error !== false || !data.data || !Array.isArray(data.data)) {
            throw new Error(data.msg || "Invalid response from Countries API");
        }

        countries = data.data
            .filter(country => country && country.country && country.iso2)
            .map(country => ({
                name: country.country,
                code: country.iso2.toUpperCase(),
                iso3: country.iso3 || "",
                cities: Array.isArray(country.cities) ? country.cities : [],
                flag: "🌍"
            }))
            .sort((a, b) => a.name.localeCompare(b.name));

        if (!countries.length) {
            throw new Error("No countries returned from API");
        }

        countrySelect.innerHTML = `<option value="">Select a country</option>`;
        countries.forEach(country => {
            const option = document.createElement("option");
            option.value = country.code;
            option.textContent = `${country.flag}  ${country.name}`;
            countrySelect.appendChild(option);
        });

        countrySelect.disabled = false;
        countryHelper.textContent = `${countries.length} countries available`;

    } catch (error) {
        console.error("Countries API error:", error);
        countrySelect.innerHTML = `<option value="">Unable to load countries</option>`;
        countryHelper.textContent = error.message || "Could not connect to the countries API.";
        showStatus(`Unable to load countries: ${error.message}. Please refresh.`, "error");
    }
}

/*
==========================================================
LOAD UNIVERSITIES - From Cloudflare Worker
==========================================================
*/
async function loadUniversities(country) {
    // Cancel previous request
    if (universityRequestController) {
        universityRequestController.abort();
    }

    universityRequestController = new AbortController();

    universitySelect.disabled = true;
    universitySelect.innerHTML = `<option value="">Loading universities...</option>`;
    setUniversityLoading(true);
    
    universityHelper.className = "helper";
    universityHelper.textContent = "";

    try {
        const countryName = country.name;
        const url = new URL(`${CONFIG.apiBase}/api/universities`);
        url.searchParams.set("country", countryName);

        const response = await fetch(url.toString(), {
            method: "GET",
            headers: {
                "Accept": "application/json"
            },
            signal: universityRequestController.signal
        });

        if (!response.ok) {
            throw new Error(`University API returned ${response.status}`);
        }

        const result = await response.json();

        // Worker returns: { data: [...], count, country }
        if (!result.data || !Array.isArray(result.data)) {
            throw new Error("Invalid university data format");
        }

        universities = result.data;

        // Populate university select
        universitySelect.innerHTML = `<option value="">Select a university</option>`;

        if (universities.length === 0) {
            universitySelect.innerHTML = `<option value="">No universities found</option>`;
            universitySelect.disabled = true;
            universityHelper.textContent = `No universities found for ${countryName} in the database.`;
            universityHelper.className = "helper warning";
            showStatus(`No universities found for ${countryName}. Please select a different country.`, "warning");
            return;
        }

        universities.forEach((university, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = university.name;
            universitySelect.appendChild(option);
        });

        universitySelect.disabled = false;
        universityHelper.textContent = `${universities.length} universities available`;

    } catch (error) {
        if (error.name === "AbortError") {
            return;
        }

        console.error("University API error:", error);
        universitySelect.innerHTML = `<option value="">Unable to load universities</option>`;
        universitySelect.disabled = true;
        universityHelper.innerHTML = `
            Could not connect to the university API. 
            <button class="retry-button" onclick="retryLoadUniversities()">Retry</button>
        `;
        universityHelper.className = "helper error";
        showStatus("Unable to load universities for this country. Please try again or select a different country.", "error");

    } finally {
        setUniversityLoading(false);
    }
}

/*
==========================================================
RETRY FUNCTION
==========================================================
*/
window.retryLoadUniversities = function() {
    if (selectedCountry) {
        loadUniversities(selectedCountry);
    }
};

/*
==========================================================
COUNTRY CHANGE
==========================================================
*/
countrySelect.addEventListener("change", async function() {
    hideStatus();

    const countryCode = this.value;

    // Reset university
    universitySelect.disabled = true;
    universitySelect.innerHTML = `<option value="">Select a country first</option>`;
    universityHelper.className = "helper";
    universityHelper.textContent = "";

    if (!countryCode) {
        selectedCountry = null;
        return;
    }

    selectedCountry = countries.find(country => country.code === countryCode);

    if (!selectedCountry) {
        return;
    }

    await loadUniversities(selectedCountry);
});

/*
==========================================================
FORM SUBMIT
==========================================================
*/
form.addEventListener("submit", function(event) {
    event.preventDefault();
    hideStatus();

    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    const countryCode = countrySelect.value;
    const universityIndex = universitySelect.value;

    if (!name) {
        showStatus("Please enter your full name.", "error");
        nameInput.focus();
        return;
    }

    if (!phone) {
        showStatus("Please enter your phone number.", "error");
        phoneInput.focus();
        return;
    }

    if (!selectedCountry) {
        showStatus("Please select a country.", "error");
        countrySelect.focus();
        return;
    }

    if (!universityIndex || !universities[Number(universityIndex)]) {
        if (universities.length === 0) {
            showStatus("No universities available for this country. Please select a different country.", "warning");
            return;
        }
        showStatus("Please select a university.", "error");
        universitySelect.focus();
        return;
    }

    const university = universities[Number(universityIndex)];

    const registration = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name: name,
        phone: phone,
        country: {
            name: selectedCountry.name,
            alpha2: selectedCountry.code,
            iso3: selectedCountry.iso3 || "",
            flag: selectedCountry.flag || "🌍"
        },
        university: {
            name: university.name,
            country: university.country,
            alpha2: university.alpha_two_code,
            domains: university.domains,
            websites: university.web_pages
        },
        createdAt: new Date().toISOString()
    };

    const registrations = getRegistrations();
    registrations.push(registration);
    saveRegistrations(registrations);

    updateRegistrationCount();
    showStatus("Registration saved successfully.", "success");

    form.reset();
    selectedCountry = null;
    universities = [];
    universitySelect.disabled = true;
    universitySelect.innerHTML = `<option value="">Select a country first</option>`;
    universityHelper.className = "helper";
    universityHelper.textContent = "";
    countryHelper.textContent = `${countries.length} countries available`;

    window.scrollTo({ top: 0, behavior: "smooth" });
});

/*
==========================================================
LOCAL JSON STORAGE
==========================================================
*/
function getRegistrations() {
    try {
        const raw = localStorage.getItem(CONFIG.storageKey);
        if (!raw) return [];
        const data = JSON.parse(raw);
        return Array.isArray(data) ? data : [];
    } catch (error) {
        console.error("Storage read error:", error);
        return [];
    }
}

function saveRegistrations(data) {
    localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));
}

/*
==========================================================
REGISTRATION COUNT
==========================================================
*/
function updateRegistrationCount() {
    const count = getRegistrations().length;
    registrationCount.textContent = `${count} ${count === 1 ? "record" : "records"}`;
}

/*
==========================================================
EXPORT JSON
==========================================================
*/
exportButton.addEventListener("click", function() {
    const registrations = getRegistrations();

    if (!registrations.length) {
        showStatus("There are no registrations to export.", "error");
        return;
    }

    const json = JSON.stringify(registrations, null, 2);
    const blob = new Blob([json], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);

    link.href = url;
    link.download = `scholar-registrations-${date}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);

    showStatus("JSON export created successfully.", "success");
});

/*
==========================================================
CLEAR LOCAL DATA
==========================================================
*/
clearButton.addEventListener("click", function() {
    const registrations = getRegistrations();

    if (!registrations.length) {
        showStatus("There are no saved registrations.", "error");
        return;
    }

    const confirmed = window.confirm("Delete all locally saved registrations?");
    if (!confirmed) return;

    localStorage.removeItem(CONFIG.storageKey);
    updateRegistrationCount();
    showStatus("All local registrations have been deleted.", "success");
});

/*
==========================================================
INITIALIZE
==========================================================
*/
document.addEventListener("DOMContentLoaded", async function() {
    updateRegistrationCount();
    await loadCountries();
});
</script>

</body>
</html>
